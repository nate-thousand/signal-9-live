name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out application
        uses: actions/checkout@v5
        with:
          path: signal-9-live
          lfs: true
      - name: Check out platform dependency
        uses: actions/checkout@v5
        with:
          repository: nate-thousand/plantasonic-platform
          path: plantasonic-platform
      - name: Check out matching Plantasonic workspace
        uses: actions/checkout@v5
        with:
          repository: nate-thousand/plantasonic
          path: plantasonic-xyz
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: signal-9-live/package-lock.json
      - name: Prepare sibling dependencies
        run: node scripts/vercel-prebuild.mjs
        working-directory: signal-9-live
      - run: npm ci
        working-directory: signal-9-live
      - run: npm run validate
        working-directory: signal-9-live
      - run: npm run build
        working-directory: signal-9-live
